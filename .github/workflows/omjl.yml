name: OM.jl integration

# Tests this package against the other OM.jl packages at the matching branch
# and runs OM.jl's test suite with it, on Julia 1.13, so that a change
# here cannot break OM.jl unnoticed. The workflow lives in JKRT/OM.jl:
# .github/workflows/omjl-ci.yml.
# Disabled on pull requests and pushes (2026-11-10, JKRT): the job is large, and it cannot find the
# library until a release has put the Artifacts.toml entries in the repository (CI.yml builds the
# library and tests this package by itself). Run it by hand from the Actions tab when needed.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # julia-actions/cache deletes the caches it replaces

concurrency:
  group: omjl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  omjl:
    uses: JKRT/OM.jl/.github/workflows/omjl-ci.yml@master
    with:
      package: OMRuntimeExternalC
      julia-versions: '["1.13"]'  # OM.jl's packages require Julia 1.13
