name: CI

# Builds libModelicaExternalC from the C sources of the Modelica Standard Library on every platform
# (deps/build_libraries.sh), checks what it depends on and exports (deps/check_library.sh), runs the tests
# of the package on Julia 1.13 against that build, and keeps the tarball of the platform (the artifact
# "ModelicaExternalC" of Artifacts.toml).
#
# Release: push a tag libs-vX.Y.Z (or run by hand with release_tag set): the tarballs of all platforms go to
# that GitHub release, and the run's Artifacts.toml has their entries (deps/bind_artifacts.jl): commit it.

on:
  pull_request:
  push:
    branches: [master]
    tags: ['libs-v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create this release (libs-vX.Y.Z) with the tarballs; empty: build and test only"
        required: false
        default: ""

permissions:
  contents: read

env:
  # modelica/ModelicaStandardLibrary, tag v4.1.0: the commit named MSL_COMMIT in deps/build_libraries.sh
  MSL_COMMIT: 8ae3d35c24e519cb2996cab20f3b13daf2b0c50a

jobs:
  library:
    name: ${{ matrix.triplet }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest,     triplet: aarch64-apple-darwin, subdir: lib, shell: bash}
          - {os: macos-15-intel,   triplet: x86_64-apple-darwin,  subdir: lib, shell: bash}
          # Ubuntu 22.04: glibc 2.35, so the library runs on the distributions of the last years
          - {os: ubuntu-22.04,     triplet: x86_64-linux-gnu,     subdir: lib, shell: bash}
          - {os: ubuntu-22.04-arm, triplet: aarch64-linux-gnu,    subdir: lib, shell: bash}
          - {os: windows-latest,   triplet: x86_64-w64-mingw32,   subdir: bin, shell: "msys2 {0}"}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: MinGW compiler (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          # keep the Windows PATH: the Julia steps below run in it
          path-type: inherit

      - name: Check out the MSL C sources
        uses: actions/checkout@v4
        with:
          repository: modelica/ModelicaStandardLibrary
          ref: ${{ env.MSL_COMMIT }}
          path: msl
          sparse-checkout: Modelica/Resources/C-Sources

      - name: Build libModelicaExternalC
        run: deps/build_libraries.sh msl/Modelica/Resources/C-Sources deps/usr/${{ matrix.subdir }}

      - name: Check its dependencies and exports
        run: deps/check_library.sh deps/usr/${{ matrix.subdir }}/libModelicaExternalC.*

      - name: Package the artifact
        run: deps/package_library.sh deps/usr/${{ matrix.subdir }} ${{ matrix.triplet }} dist

      - uses: actions/upload-artifact@v4
        with:
          name: library-${{ matrix.triplet }}
          path: dist/ModelicaExternalC.${{ matrix.triplet }}.tar.gz
          if-no-files-found: error

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      # The package finds the library in deps/usr/{lib,bin} (built above), not in an artifact.
      - uses: julia-actions/julia-runtest@v1

  release:
    name: Release ${{ inputs.release_tag || github.ref_name }}
    needs: library
    if: (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || startsWith(github.ref, 'refs/tags/libs-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: library-*
          merge-multiple: true
          path: dist

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"

      - name: Create the release with the tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/ModelicaExternalC.*.tar.gz --target "$GITHUB_SHA" \
            --title "libModelicaExternalC $TAG" \
            --notes "Built from the C sources of the Modelica Standard Library v4.1.0 ($MSL_COMMIT) and src/C/ModelicaCallbacks.c at ${GITHUB_SHA}. Licenses: THIRD_PARTY_LICENSES.md."

      - name: Write the entries of Artifacts.toml
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: julia deps/bind_artifacts.jl "$TAG" dist

      - uses: actions/upload-artifact@v4
        with:
          name: Artifacts.toml
          path: Artifacts.toml
