name: CI

# Builds libModelicaExternalC from the C sources of the Modelica Standard Library on every platform
# (deps/build_libraries.sh, the script Yggdrasil's M/ModelicaExternalC runs), checks what it depends on and
# exports (deps/check_library.sh), and runs the tests of the package on Julia 1.13 against that build: the
# preference libModelicaExternalC_path of ModelicaExternalC_jll names it, so a change of the C shim is tested
# before Yggdrasil builds it. The coverage of the tests on x86_64-linux-gnu goes to the job summary and, on
# master pushes, to gh-pages for the README's badge (the coverage job).

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'COPYING'
      - 'CITATION.bib'
      - '.gitignore'
      - '.github/workflows/omjl.yml'
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'COPYING'
      - 'CITATION.bib'
      - '.gitignore'
      - '.github/workflows/omjl.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  # modelica/ModelicaStandardLibrary, tag v4.1.0: the commit named MSL_COMMIT in deps/build_libraries.sh
  MSL_COMMIT: 8ae3d35c24e519cb2996cab20f3b13daf2b0c50a

jobs:
  library:
    name: ${{ matrix.triplet }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest,     triplet: aarch64-apple-darwin, subdir: lib, shell: bash}
          - {os: macos-15-intel,   triplet: x86_64-apple-darwin,  subdir: lib, shell: bash}
          # Linux: the library is built in a manylinux_2_28 container (AlmaLinux 8, glibc 2.28), so it runs on
          # every distribution with glibc 2.28 or newer (RHEL 8, Debian 10, Ubuntu 18.10); the tests run on the runner
          - {os: ubuntu-22.04,     triplet: x86_64-linux-gnu,     subdir: lib, shell: bash, manylinux: manylinux_2_28_x86_64}
          - {os: ubuntu-22.04-arm, triplet: aarch64-linux-gnu,    subdir: lib, shell: bash, manylinux: manylinux_2_28_aarch64}
          - {os: windows-latest,   triplet: x86_64-w64-mingw32,   subdir: bin, shell: "msys2 {0}"}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4

      - name: MinGW compiler (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          # keep the Windows PATH: the Julia steps below run in it
          path-type: inherit

      - name: Check out the MSL C sources
        uses: actions/checkout@v4
        with:
          repository: modelica/ModelicaStandardLibrary
          ref: ${{ env.MSL_COMMIT }}
          path: msl
          sparse-checkout: Modelica/Resources/C-Sources

      - name: Build libModelicaExternalC
        if: matrix.manylinux == ''
        run: deps/build_libraries.sh msl/Modelica/Resources/C-Sources deps/usr/${{ matrix.subdir }}

      # as the runner's user: the files in the workspace stay deletable by the runner
      - name: Build libModelicaExternalC (manylinux_2_28 container)
        if: matrix.manylinux != ''
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/w -w /w quay.io/pypa/${{ matrix.manylinux }} \
            deps/build_libraries.sh msl/Modelica/Resources/C-Sources deps/usr/${{ matrix.subdir }}

      - name: Check its dependencies and exports
        run: deps/check_library.sh deps/usr/${{ matrix.subdir }}/libModelicaExternalC.*

      # The package loads the file this preference names in place of the JLL's (Pkg.test reads the
      # LocalPreferences.toml next to Project.toml).
      - name: Name this build in the preference of ModelicaExternalC_jll
        run: |
          case "$RUNNER_OS" in Windows) root=$(cygpath -m "$PWD"); ext=dll ;; macOS) root=$PWD; ext=dylib ;; *) root=$PWD; ext=so ;; esac
          printf '[ModelicaExternalC_jll]\nlibModelicaExternalC_path = "%s"\n' \
            "$root/deps/usr/${{ matrix.subdir }}/libModelicaExternalC.$ext" > LocalPreferences.toml
          cat LocalPreferences.toml

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1

      # The coverage of the Julia code (julia-runtest runs the tests with coverage) from one platform, for the
      # coverage job.
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.triplet == 'x86_64-linux-gnu'
        with:
          directories: src

      - uses: actions/upload-artifact@v4
        if: matrix.triplet == 'x86_64-linux-gnu'
        with:
          name: lcov
          path: lcov.info
          if-no-files-found: error

  # The tests against the library users get: ModelicaExternalC_jll's, no preference.
  jll:
    name: ModelicaExternalC_jll, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.13"
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: false

  # The total and the per-file lines in the job summary, and on master pushes coverage.json (a shields.io
  # endpoint) on gh-pages for the README's badge. No external service. After all platforms passed.
  coverage:
    name: Coverage
    needs: library
    runs-on: ubuntu-latest
    permissions:
      contents: write  # coverage.json on gh-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lcov

      - name: Coverage summary
        run: |
          awk -F: '
            /^SF:/ { f = substr($0, 4); if (!(f in n)) { F++; n[f] = 0; h[f] = 0 } }
            /^LH:/ { h[f] += $2; H += $2 }
            /^LF:/ { n[f] += $2; N += $2 }
            END {
              p = N == 0 ? 0 : 100 * H / N
              c = p >= 90 ? "brightgreen" : p >= 80 ? "green" : p >= 70 ? "yellowgreen" : p >= 60 ? "yellow" : p >= 50 ? "orange" : "red"
              m = N == 0 ? "unknown" : sprintf("%.1f%%", p)
              printf "{\"schemaVersion\": 1, \"label\": \"coverage\", \"message\": \"%s\", \"color\": \"%s\"}\n", m, c > "coverage.json"
              printf "## Coverage of OMRuntimeExternalC.jl/src\n\n**%s**: %d of %d lines, %d files.\n\n", m, H, N, F
              print "| file | covered | lines | |"
              print "|---|---:|---:|---:|"
              for (f in n) printf "| `%s` | %d | %d | %.1f %% |\n", f, h[f], n[f], n[f] == 0 ? 0 : 100 * h[f] / n[f]
            }' lcov.info >> "$GITHUB_STEP_SUMMARY"
          cat coverage.json

      # Documenter may deploy to the same branch: a rejected push starts again from the branch's new tip.
      - name: Publish the badge on gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          badge="$PWD/coverage.json"
          pages="$RUNNER_TEMP/coverage-pages"
          for attempt in 1 2 3; do
            rm -rf "$pages" && git worktree prune
            if git fetch --depth=1 origin gh-pages; then
              git worktree add --detach "$pages" FETCH_HEAD
            else
              git worktree add --orphan -b "coverage-pages-$attempt" "$pages"
            fi
            cp "$badge" "$pages/coverage.json"
            git -C "$pages" add coverage.json
            if git -C "$pages" diff --cached --quiet; then echo "coverage unchanged"; exit 0; fi
            git -C "$pages" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Coverage badge: $(sed -n 's/.*"message": "\([^"]*\)".*/\1/p' "$badge") (${GITHUB_SHA::8})"
            git -C "$pages" push origin HEAD:refs/heads/gh-pages && exit 0
            sleep $((attempt * 10))
          done
          exit 1
